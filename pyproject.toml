[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-mouse-utils"
version = "0.1.0"
description = "Mouse utilities for Omarchy: find the pointer with a spotlight, or follow it with crosshairs or a highlight ring — all click-through."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["omarchy", "powertoys", "find-my-mouse", "crosshairs", "hyprland", "quickshell"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.scripts]
omarchy-mouse-utils = "omouse.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-mouse-utils"

[tool.setuptools.packages.find]
include = ["omouse*"]

[tool.setuptools.package-data]
omouse = ["qml/*.qml"]
